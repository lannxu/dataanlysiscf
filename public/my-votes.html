<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人才盘点 · 我的初评结果</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/i18n.js"></script>
</head>
<body>
<main class="shell pre-shell">
  <div class="top">
    <div>
      <div class="brand">我的初评结果</div>
      <div class="muted"><span class="status-dot"></span>现场讨论时查看自己之前提交的会前初评记录</div>
    </div>
  </div>

  <section class="card my-votes-card">
    <div class="pre-toolbar my-votes-toolbar">
      <label>评估人</label>
      <input id="evaluatorName" placeholder="输入提交/导入时使用的姓名或编号">
      <button id="loadVotes">查看结果</button>
    </div>
    <p class="muted pre-skip-tip">如导入了初评结果，请输入导入表里的评估人名称；如是在本机提交，也会自动匹配本机记录。</p>
    <div class="toast" id="status"></div>
  </section>

  <section class="card my-current-vote-card" style="margin-top:16px">
    <div class="section"><h2>初评结果当前员工</h2><span class="muted" id="currentStatus">跟随初评结果单人页面实时更新</span></div>
    <div id="currentVoteView"><div class="empty">请输入评估人姓名或编号后查看</div></div>
  </section>

  <section class="card my-votes-card" style="margin-top:16px">
    <div class="section"><h2>我评估过的全部名单</h2><span class="muted" id="voteCount">--</span></div>
    <div class="my-votes-list" id="myVotesList"><div class="empty">请输入评估人姓名或编号后查看</div></div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const roomId = params.get('room') || 'default';
const roomUrl = value => {
  const u = new URL(value, location.href);
  if (u.pathname.startsWith('/api/') && roomId) u.searchParams.set('room', roomId);
  if (['/api/results','/api/vote','/api/my-vote','/api/my-votes'].includes(u.pathname)) u.searchParams.set('mode', 'initial');
  return u.pathname + u.search + u.hash;
};
const nativeFetch = window.fetch.bind(window);
window.fetch = (input, init) => nativeFetch(typeof input === 'string' && input.startsWith('/api/') ? roomUrl(input) : input, init);
const $ = s => document.querySelector(s);
const wsRoomPath = roomId && roomId !== 'default' ? '/?room=' + encodeURIComponent(roomId) : '';
let myItems = [];
let currentEmployee = null;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function deviceEvaluatorId(){
  try { return localStorage.getItem('preEvaluatorId') || localStorage.getItem('evaluatorId') || ''; } catch { return ''; }
}
function restoreName(){
  try { $('#evaluatorName').value = localStorage.getItem('preEvaluatorName') || ''; } catch {}
}
function saveName(){
  try { localStorage.setItem('preEvaluatorName', $('#evaluatorName').value.trim()); } catch {}
}
function personLine(item){
  return [item.department, item.role].filter(Boolean).join(' · ');
}
function voteText(item){
  if (!item) return '<span class="my-vote-missing">未查询到我的记录</span>';
  if (item.skip) return '<span class="my-vote-skip">Skip</span>';
  return '<span class="recommend">PL' + item.pl + ' / POT' + item.pot + '<br><b>Box ' + item.grid + '</b></span>';
}
function commentText(item){
  if (!item) return '<em>如果你已做过初评，请确认上方输入的评估人名称和导入/提交时一致。</em>';
  return item.comment ? esc(item.comment) : '<em>暂无 Comments</em>';
}

// ---- 修改自己的初评 ----
let editing = null; // {employeeId, key, evaluator, pl, pot}
const boxFromLevels = (plValue, potValue) => {
  if (!plValue || !potValue) return null;
  const group = plValue >= 4 ? 'H' : plValue === 3 ? 'M' : 'L';
  return ({'H,3':1,'H,2':2,'H,1':4,'M,3':3,'M,2':5,'M,1':7,'L,3':6,'L,2':8,'L,1':9})[group + ',' + potValue] || null;
};
function choiceRow(prefix, total, current, attr){
  return '<div class="options' + (prefix === 'POT' ? ' pot' : '') + '">' + Array.from({length: total}, (_, i) => i + 1).map(i =>
    '<button type="button" class="choice' + (current === i ? ' active' : '') + '" data-' + attr + '="' + i + '">' + prefix + i + '</button>').join('') + '</div>';
}
function editFormHtml(item){
  const draft = editing || {};
  const box = boxFromLevels(draft.pl, draft.pot);
  return '<div class="my-vote-edit" data-edit-form="' + esc(item.employeeId) + '">' +
    '<div class="dimension"><h2>绩效等级（PL）</h2>' + choiceRow('PL', 5, draft.pl, 'pl') + '</div>' +
    '<div class="dimension"><h2>潜力等级（POT）</h2>' + choiceRow('POT', 3, draft.pot, 'pot') + '</div>' +
    '<div class="pre-box-preview' + (box ? ' active' : '') + '">' + (box ? '当前选择：PL' + draft.pl + ' / POT' + draft.pot + ' → Box ' + box : '选择 PL 和 POT 后显示 Box') + '</div>' +
    '<div class="pre-submit-row">' +
      '<button type="button" class="submit" data-submit-edit>提交修改</button>' +
      '<button type="button" class="secondary" data-skip-edit>Skip</button>' +
      '<button type="button" class="secondary" data-cancel-edit>取消</button>' +
    '</div>' +
    '<div class="toast" data-edit-toast></div>' +
  '</div>';
}
function editButtonHtml(item){
  return item ? '<button type="button" class="secondary my-edit-btn" data-edit-btn="' + esc(item.employeeId) + '">修改 Revise</button>' : '';
}
function syncChoices(form){
  if (!form || !editing) return;
  form.querySelectorAll('[data-pl]').forEach((btn, i) => btn.classList.toggle('active', i + 1 === editing.pl));
  form.querySelectorAll('[data-pot]').forEach((btn, i) => btn.classList.toggle('active', i + 1 === editing.pot));
  const preview = form.querySelector('.pre-box-preview');
  const box = boxFromLevels(editing.pl, editing.pot);
  if (preview) {
    preview.classList.toggle('active', !!box);
    preview.textContent = box ? '当前选择：PL' + editing.pl + ' / POT' + editing.pot + ' → Box ' + box : '选择 PL 和 POT 后显示 Box';
  }
}
async function submitEdit(skip){
  if (!editing) return;
  const form = document.querySelector('[data-edit-form="' + CSS.escape(editing.employeeId) + '"]');
  const toast = form?.querySelector('[data-edit-toast]');
  // 表单不再编辑备注，提交时沿用原备注
  const original = myItems.find(x => x.employeeId === editing.employeeId);
  const comment = original?.commentDetail || {strength: '', improvementArea: '', others: ''};
  if (!skip && !(editing.pl && editing.pot)) { if (toast) toast.textContent = '请选择 PL 和 POT，或改用 Skip'; return; }
  const response = await fetch('/api/vote', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({evaluatorId: editing.key, evaluatorName: editing.evaluator, employeeId: editing.employeeId, pl: editing.pl, pot: editing.pot, skip, comment})
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { if (toast) toast.textContent = data.error || '提交失败'; return; }
  const editedId = editing.employeeId;
  editing = null;
  $('#status').textContent = '已更新对 ' + (myItems.find(x => x.employeeId === editedId)?.name || '该员工') + ' 的初评';
  await loadVotes();
}
document.addEventListener('click', async event => {
  const editBtn = event.target.closest('[data-edit-btn]');
  if (editBtn) {
    const item = myItems.find(x => x.employeeId === editBtn.dataset.editBtn);
    if (!item) return;
    editing = {employeeId: item.employeeId, key: item.evaluatorKey || deviceEvaluatorId(), evaluator: item.evaluator || $('#evaluatorName').value.trim(), pl: item.skip ? 0 : (item.pl || 0), pot: item.skip ? 0 : (item.pot || 0)};
    render(myItems);
    return;
  }
  const plBtn = event.target.closest('[data-pl]');
  if (plBtn) { if (editing) { editing.pl = Number(plBtn.dataset.pl); syncChoices(plBtn.closest('[data-edit-form]')); } return; }
  const potBtn = event.target.closest('[data-pot]');
  if (potBtn) { if (editing) { editing.pot = Number(potBtn.dataset.pot); syncChoices(potBtn.closest('[data-edit-form]')); } return; }
  if (event.target.closest('[data-cancel-edit]')) { editing = null; render(myItems); return; }
  if (event.target.closest('[data-submit-edit]')) { await submitEdit(false); return; }
  if (event.target.closest('[data-skip-edit]')) { await submitEdit(true); return; }
});

function renderCurrent(){
  const box = $('#currentVoteView');
  if (!currentEmployee) { box.innerHTML = '<div class="empty">等待主持人选择员工</div>'; return; }
  const item = myItems.find(x => x.employeeId === currentEmployee.id);
  box.innerHTML = '<div class="my-current-person">' +
    '<div><b>' + esc(currentEmployee.name) + '</b><span>' + esc([currentEmployee.department, currentEmployee.role].filter(Boolean).join(' · ')) + '</span></div>' +
    '<div>' + voteText(item) + editButtonHtml(item) + '</div>' +
    '<p>' + commentText(item) + '</p>' +
    (item && editing?.employeeId === item.employeeId ? editFormHtml(item) : '') +
  '</div>';
  $('#currentStatus').textContent = item ? '已显示你对当前员工的初评' : '当前员工暂未匹配到你的初评';
}
function render(items){
  myItems = items || [];
  $('#voteCount').textContent = myItems.length + ' 条';
  $('#myVotesList').innerHTML = myItems.length ? myItems.map(item =>
    '<div class="my-vote-item">' +
      '<div><b>' + esc(item.name) + '</b><span>' + esc(personLine(item)) + '</span></div>' +
      '<div>' + voteText(item) + '</div>' +
      '<p>' + commentText(item) + '</p>' +
    '</div>'
  ).join('') : '<div class="empty">没有查到记录，请确认评估人姓名/编号是否和提交或导入时一致。</div>';
  renderCurrent();
}
async function loadState(){
  try {
    const data = await fetch('/api/initial-state', {cache:'no-store'}).then(r => r.json());
    currentEmployee = data.employee || null;
    renderCurrent();
  } catch {
    $('#currentStatus').textContent = '同步中断，请确认手机和电脑在同一网络';
  }
}
async function loadVotes(){
  const name = $('#evaluatorName').value.trim();
  const deviceId = deviceEvaluatorId();
  saveName();
  if (!name && !deviceId) {
    $('#status').textContent = '请输入评估人姓名或编号';
    render([]);
    return;
  }
  $('#status').textContent = '正在查询...';
  const query = new URLSearchParams();
  if (name) query.set('evaluatorName', name);
  if (deviceId) query.set('evaluatorId', deviceId);
  const response = await fetch('/api/my-votes?' + query.toString(), {cache:'no-store'});
  const data = await response.json();
  if (!response.ok) {
    $('#status').textContent = data.error || '查询失败';
    render([]);
    return;
  }
  $('#status').textContent = '已查询到 ' + data.total + ' 条记录';
  render(data.items || []);
}
function applyStateMessage(message){
  currentEmployee = message?.data?.employee || currentEmployee;
  renderCurrent();
}
function connect(){
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + wsRoomPath);
  ws.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.type === 'initial-current') applyStateMessage(message);
    if (message.type === 'initial-results' || message.type === 'employees') {
      if ($('#evaluatorName').value.trim() || deviceEvaluatorId()) loadVotes(); else loadState();
    }
  };
  ws.onopen = () => { $('#currentStatus').textContent = '已连接，跟随初评结果单人页面实时更新'; };
  ws.onclose = () => { $('#currentStatus').textContent = '正在重新连接，同步会自动恢复'; setTimeout(connect, 1200); };
}

$('#loadVotes').onclick = loadVotes;
$('#evaluatorName').addEventListener('keydown', event => { if (event.key === 'Enter') loadVotes(); });
restoreName();
loadState();
connect();
setInterval(loadState, 2000);
if ($('#evaluatorName').value.trim() || deviceEvaluatorId()) loadVotes();
</script>
</body>
</html>
